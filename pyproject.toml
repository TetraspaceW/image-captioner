[project]
name = "image-captioner"
version = "0.1.0"
description = "Discord bot that explains images using AI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "discord.py>=2.7.1",
    "python-dotenv>=1.2.2",
    "aiohttp>=3.13.3",
    "openrouter>=0.7.11",
    "logging>=0.4.9.6",
]

[project.scripts]
image-captioner = "bot:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
