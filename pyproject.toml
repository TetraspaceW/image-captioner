[project]
name = "image-captioner"
version = "0.1.0"
description = "Discord bot that explains images using AI"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "discord.py==2.3.2",
    "openai==1.3.7",
    "python-dotenv==1.0.0",
    "aiohttp==3.9.1",
    "openrouter>=0.0.19",
]

[project.scripts]
image-captioner = "bot:main"

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
